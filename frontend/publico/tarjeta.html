<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1526">
<!--
  TARJETA DE PRESENTACION de un proveedor. Pagina PUBLICA: se abre sin cuenta,
  sin sesion y casi siempre desde un celular, porque la liga va a viajar pegada
  en WhatsApp. De ahi las tres decisiones de esta hoja:

  1) Es un archivo suelto, no una pantalla del dashboard. El dashboard pesa
     760 KB y arranca pidiendo un login; una tarjeta que tarda o que pregunta
     quien eres no se ensena a nadie.
  2) Los datos vienen ya EMBEBIDOS en window.TARJETA (los mete el servidor en
     /p/{slug}). Cero peticiones para pintar: se ve completa en el primer
     cuadro, aunque la senal del lobby este mal.
  3) Las etiquetas Open Graph las arma el servidor, no este script. El robot de
     WhatsApp no ejecuta JavaScript.

  Lo que esta hoja NO ensena, y es a proposito: precios, telefono, correo,
  RFC, datos bancarios. El servidor tampoco los manda. Ver app/api/v1/public.py.
-->
<!--OG-->
<style>
  :root{
    --bg:#f4f5fa; --card:#ffffff; --line:#e6e8f0; --txt:#1b1f2e; --mut:#697089; --mut2:#9aa0b6;
    --acc:#382ca1; --acc2:#6d5ef0; --ok:#10b981; --warn:#f59e0b;
    --grad:linear-gradient(135deg,#4b3ec9,#382ca1);
    --shadow:0 1px 2px rgba(24,28,52,.04),0 4px 14px rgba(24,28,52,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 96px}
  @media(min-width:600px){ .wrap{padding:22px 22px 110px} }

  /* --- Portada --------------------------------------------------------- */
  .hero{position:relative;height:290px;background:var(--grad);background-size:cover;background-position:center;
    display:flex;align-items:flex-end;overflow:hidden}
  @media(min-width:600px){ .hero{border-radius:18px 18px 0 0} }
  /* El velo oscuro no es decoracion: sin el, un nombre blanco sobre una foto
     clara (una playa a mediodia) no se lee. */
  .hero:after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(6,12,26,.92) 0%,rgba(6,12,26,.55) 38%,rgba(6,12,26,.08) 78%)}
  .hero .mono{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .hero .mono b{font-size:64px;font-weight:800;letter-spacing:3px;color:#fff;opacity:.30;line-height:1}
  .hero .mono span{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;opacity:.55}
  .heroin{position:relative;z-index:2;padding:20px 18px 18px;width:100%}
  .heroin h1{font-size:25px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.18}
  .heroin .sub{color:#cdd4ea;font-size:13px;margin-top:4px;font-weight:500}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .bdg{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.3px;
    padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(6px)}
  .bdg.ver{background:rgba(59,130,246,.9)}
  .bdg.par{background:linear-gradient(135deg,#f6b73c,#e0912a)}

  /* --- Cuerpo ---------------------------------------------------------- */
  .body{background:var(--card);padding:18px}
  @media(min-width:600px){ .body{border-radius:0 0 18px 18px;box-shadow:var(--shadow)} }
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);
    background:#f1f3f9;border-radius:8px;padding:5px 10px;font-weight:500}
  .chip b{color:var(--txt);font-weight:600}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut2);font-weight:700;
    margin:22px 0 10px}
  .bio{color:#39405a;white-space:pre-line}

  /* --- El bloque de datos: lo que Instagram no puede dar ---------------
     Va ARRIBA del todo, pegado a la portada. Es la razon de ser de la
     tarjeta: un perfil de Instagram no puede demostrar nada, y esto son
     numeros que el proveedor no escribio. */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .stats div{background:#fff;padding:12px 6px;text-align:center}
  .stats b{display:block;font-size:21px;font-weight:800;letter-spacing:-.6px;color:var(--acc);line-height:1.1}
  .stats b i{font-style:normal;font-size:13px}
  .stats span{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
    color:var(--mut2);margin-top:3px}
  .stats .est{color:var(--warn)}

  .meds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .med{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#7a5a10;
    background:linear-gradient(135deg,#fff4d9,#ffe6ab);border:1px solid #f2d489;border-radius:10px;padding:6px 10px}

  /* Cada barra lleva SU muestra escrita al lado. Un 100% sobre 3 actuaciones
     y uno sobre 300 no son el mismo dato, y quien lo lee tiene derecho a
     saber cual esta viendo. */
  .bars{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:14px}
  .bar{margin-bottom:12px}
  .bar:last-child{margin-bottom:0}
  .bar .t{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px}
  .bar .t b{font-weight:700;font-size:13.5px}
  .bar .t u{text-decoration:none;color:var(--acc);font-weight:800;font-size:15px}
  .bar .mu{color:var(--mut2);font-size:11px;margin-top:5px}
  .bar .tr{height:6px;border-radius:6px;background:#eef0f7;overflow:hidden}
  .bar .fi{height:100%;border-radius:6px;background:var(--grad)}

  .hots{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
  .hot{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;
    padding:6px 10px 6px 6px;font-size:12.5px;font-weight:600}
  .hot i{width:24px;height:24px;border-radius:6px;background:#eef0f7 center/cover;display:grid;place-items:center;
    font-style:normal;font-size:10px;font-weight:800;color:var(--mut2);flex:none}
  .hot em{font-style:normal;color:var(--mut2);font-weight:600;font-size:11.5px}

  .rev{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}
  .rev .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .rev .hd i{width:28px;height:28px;border-radius:7px;background:#eef0f7 center/cover;flex:none}
  .rev .hd b{font-size:13px;font-weight:700}
  .rev .hd span{font-size:11px;color:var(--mut2);display:block}
  .rev .st{color:#f6b73c;font-size:13px;letter-spacing:1px;margin-left:auto}
  .rev p{font-size:13.5px;color:#39405a}
  .rev .fe{font-size:11px;color:var(--mut2);margin-top:6px}

  .nuevo{border:1px dashed var(--line);border-radius:14px;padding:13px;margin-bottom:14px;
    font-size:12.5px;color:var(--mut)}
  .nuevo b{color:var(--txt)}

  .show{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;display:flex;gap:12px}
  .show .th{width:74px;height:74px;border-radius:10px;flex:none;background-size:cover;background-position:center}
  .show .th .ini{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;opacity:.5}
  .show h3{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .show .meta{font-size:12px;color:var(--mut);margin-top:2px}
  .show .desc{font-size:13px;color:#4a5170;margin-top:6px}
  .gen{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .gen span{font-size:10.5px;font-weight:600;color:var(--acc);background:#eeecfb;border-radius:6px;padding:2px 7px}

  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .gal a{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;background-color:#e6e8f0}

  .vid{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:13px;
    margin-bottom:10px}
  .vid .pl{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;
    font-size:14px;flex:none}
  .vid b{font-size:14px;display:block}
  .vid span{font-size:12px;color:var(--mut)}

  /* --- Llamada a la accion, fija abajo --------------------------------- */
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:11px 14px calc(11px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    display:flex;gap:9px;max-width:560px;margin:0 auto}
  .btn{flex:1;border:0;border-radius:12px;padding:13px 16px;font-size:14.5px;font-weight:700;cursor:pointer;
    font-family:inherit;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(56,44,161,.28)}
  .btn.gh{flex:none;background:#f1f3f9;color:var(--txt);box-shadow:none;padding:13px 15px}
  .btn:active{transform:translateY(1px)}

  .foot{text-align:center;padding:26px 18px 8px;color:var(--mut2);font-size:11.5px}
  .foot b{color:var(--acc);font-weight:700}

  /* --- Formulario ------------------------------------------------------ */
  .ov{position:fixed;inset:0;background:rgba(12,21,38,.55);z-index:60;display:none;align-items:flex-end;
    justify-content:center;backdrop-filter:blur(2px)}
  @media(min-width:600px){ .ov{align-items:center} }
  .mod{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px 24px;
    max-height:92vh;overflow:auto}
  @media(min-width:600px){ .mod{border-radius:18px} }
  .mod h3{font-size:17px;font-weight:750;margin-bottom:3px}
  .mod p.h{font-size:13px;color:var(--mut);margin-bottom:15px}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin:11px 0 4px;letter-spacing:.2px}
  input,textarea{width:100%;border:1px solid var(--line);background:#f7f8fc;border-radius:10px;padding:11px 12px;
    font-size:15px;font-family:inherit;color:var(--txt)}
  input:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:-1px;background:#fff}
  textarea{min-height:74px;resize:vertical}
  .err{color:#ef4444;font-size:12.5px;margin-top:10px;display:none}
  .okbox{text-align:center;padding:14px 4px}
  .okbox .tick{width:54px;height:54px;border-radius:50%;background:#dcfce7;color:#10b981;display:grid;
    place-items:center;font-size:26px;margin:0 auto 12px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#1b1f2e;color:#fff;
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero" id="hero">
    <div class="heroin">
      <div class="badges" id="badges"></div>
      <h1 id="nombre"></h1>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="body" id="body"></div>
  <div class="foot">
    Perfil publicado en <b>SHOWMA</b> · Entertainment OS<br>
    <a id="flink" href="/" style="color:#9aa0b6">showma.mx</a>
  </div>
</div>

<div class="cta">
  <button class="btn" onclick="abrir()">Solicitar este show</button>
  <button class="btn gh" onclick="compartir()" title="Compartir" aria-label="Compartir">Compartir</button>
</div>

<div class="ov" id="ov">
  <div class="mod" id="mod"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* Sin datos no hay tarjeta: el servidor siempre los inyecta, pero si alguien
   abre el archivo suelto no debe quedarse una pantalla rota a medias. */
const T = window.TARJETA || null;
const API = (window.RICKY_API || '') + '/api/v1';
const CATCOL = {"Musica":"#382ca1","Shows":"#f59e0b","Fotografia y Video":"#3b82f6","Produccion":"#10b981"};
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grad = c => `linear-gradient(135deg,${CATCOL[c]||'#382ca1'},#8b5cf6)`;
/* Mismo criterio que el catalogo de dentro: dos letras, y el "&" de
   "Sax & Soul" no cuenta como palabra. */
const iniciales = n => ((n||'').split(/\s+/).filter(w=>w && /[a-záéíóúñ0-9]/i.test(w[0]))
  .slice(0,2).map(w=>w[0]).join('') || '?').toUpperCase();
const pretty = s => ({'Musica':'Música','Produccion':'Producción',
  'Fotografia y Video':'Fotografía y Video'})[s] || s || '';

/* ---- Lo que la plataforma DEMUESTRA --------------------------------------
   El motivo de que esta tarjeta exista: un perfil de Instagram enseña fotos y
   seguidores, pero no puede demostrar que alguien cumplió 11 de 11
   actuaciones. Ni un número de aquí lo escribió el proveedor.

   Las dos reglas de honestidad vienen del servidor y aquí sólo se respetan:
   cada porcentaje se pinta CON SU MUESTRA al lado, y si el proveedor todavía
   no tiene historia suficiente (`nuevo`) no se pinta ni un porcentaje — se
   dice que es nuevo. Un "100% de cumplimiento" con una sola actuación es
   verdad y a la vez es mentira, y el día que un hotel contrate por un número
   de aquí y le salga mal, se acabó la credibilidad de todas las tarjetas. */
function datosHTML(t){
  if(!t) return '';
  const h=[];
  const anio = t.desde ? t.desde.slice(0,4) : null;
  const cal = t.calificacion;

  const celdas=[];
  if(t.actuaciones) celdas.push(`<div><b>${t.actuaciones}</b><span>Actuaciones</span></div>`);
  if(t.hoteles)     celdas.push(`<div><b>${t.hoteles}</b><span>${t.hoteles>1?'Hoteles':'Hotel'}</span></div>`);
  if(cal && cal.promedio!=null)
    celdas.push(`<div><b>${cal.promedio}<i>★</i></b><span>${cal.total} reseña${cal.total>1?'s':''}</span></div>`);
  if(anio)          celdas.push(`<div><b>${esc(anio)}</b><span>Desde</span></div>`);
  if(celdas.length){
    h.push(`<h2>Comprobado por SHOWMA</h2>`);
    // Con menos de cuatro datos la rejilla de cuatro deja huecos: se ajusta.
    h.push(`<div class="stats" style="grid-template-columns:repeat(${celdas.length},1fr)">${celdas.join('')}</div>`);
  }

  const meds=(t.distinciones||[]).map(d=>`<span class="med" title="${esc(d.detalle||'')}">🏅 ${esc(d.texto)}</span>`);
  if(meds.length) h.push(`<div class="meds">${meds.join('')}</div>`);

  if(t.nuevo){
    h.push(`<div class="nuevo"><b>Nuevo en SHOWMA.</b> Todavía no tiene actuaciones suficientes
      para publicar porcentajes. Lo que se ve arriba sí está comprobado por la plataforma.</div>`);
  }else{
    const barras=[];
    const bar=(etq,pct,muestra,nota)=>barras.push(`<div class="bar">
      <div class="t"><b>${esc(etq)}</b><u>${pct}%</u></div>
      <div class="tr"><div class="fi" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div>
      <div class="mu">${esc(muestra)}${nota?' · '+esc(nota):''}</div>
    </div>`);
    const c=t.cumplimiento;
    if(c && c.pct!=null) bar('Cumplió lo que aceptó', c.pct, `sobre ${c.muestra} actuaciones`);
    const r=t.recontratacion;
    if(r && r.pct!=null) bar('Hoteles que lo repitieron', r.pct,
      `${r.hoteles_que_repitieron} de ${r.hoteles_totales} hoteles`);
    const p=t.publico;
    if(p && p.retencion_pct!=null) bar('El público se quedó', p.retencion_pct,
      `sobre ${p.muestra_retencion} actuaciones`, p.estimado?'estimado':'');
    if(p && p.ocupacion_pct!=null) bar('Qué tan lleno estuvo', p.ocupacion_pct,
      `sobre ${p.muestra_aforo} actuaciones`, p.estimado?'estimado':'');
    if(barras.length) h.push(`<div class="bars">${barras.join('')}</div>`);
    const resp=t.respuesta;
    if(resp && resp.horas!=null && resp.horas>0)
      h.push(`<div class="chips" style="margin-bottom:14px"><span class="chip">⏱️ Contesta en
        <b>${duracion(resp.horas)}</b> (mediana de ${resp.muestra})</span></div>`);
  }

  const hs=t.hoteles_detalle||[];
  if(hs.length){
    h.push('<h2>Dónde ha tocado</h2><div class="hots">');
    hs.slice(0,10).forEach(x=>{
      const ic=x.logo_url
        ? `<i style="background-image:url('${esc(x.logo_url)}')"></i>`
        : `<i>${esc(iniciales(x.nombre))}</i>`;
      h.push(`<span class="hot">${ic}${esc(x.nombre)} <em>· ${x.actuaciones}</em></span>`);
    });
    h.push('</div>');
  }
  return h.join('');
}

/* "168 h" no lo lee nadie: son siete días y hay que decirlo así. El servidor
   manda siempre horas, y la unidad se elige al pintar. */
function duracion(horas){
  if(horas < 1)  return Math.round(horas*60)+' min';
  if(horas < 48) return (Math.round(horas*10)/10)+' h';
  const d = Math.round(horas/24);
  return d+(d===1?' día':' días');
}

/* Los comentarios. Sale el hotel y el CARGO de quien firma, nunca su nombre
   propio: esa opinión se escribió dentro de una plataforma cerrada. */
function resenasHTML(rs){
  if(!rs || !rs.length) return '';
  const h=['<h2>Lo que dicen los hoteles</h2>'];
  rs.forEach(r=>{
    const ic=r.logo?`<i style="background-image:url('${esc(r.logo)}')"></i>`:`<i></i>`;
    h.push(`<div class="rev">
      <div class="hd">${ic}<div><b>${esc(r.hotel||'Hotel')}</b>
        ${r.cargo?`<span>${esc(r.cargo)}</span>`:''}</div>
        <div class="st">${'★'.repeat(r.estrellas||0)}</div></div>
      ${r.comentario?`<p>${esc(r.comentario)}</p>`:''}
      ${r.fecha?`<div class="fe">${esc(mesAnio(r.fecha))}</div>`:''}
    </div>`);
  });
  return h.join('');
}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
  'septiembre','octubre','noviembre','diciembre'];
/* La fecha se parte a mano. `new Date('2026-08-08')` la lee como UTC y en
   México la pinta un día antes, que en el cambio de mes es un mes antes. */
function mesAnio(iso){
  const p=(iso||'').split('-');
  return p.length>=2 ? MESES[+p[1]-1]+' de '+p[0] : iso;
}

function pintar(){
  if(!T){ document.body.innerHTML = '<p style="padding:60px;text-align:center;color:#697089">Tarjeta no disponible.</p>'; return; }
  document.getElementById('flink').href = (window.RICKY_API||'') + '/';

  // Portada. Sin foto van las iniciales sobre el degradado de su categoria:
  // el mismo recurso que el catalogo, para que el hueco no se lea como error.
  const hero = document.getElementById('hero');
  if(T.portada){ hero.style.backgroundImage = `url('${T.portada}')`; }
  else{
    hero.style.background = grad(T.categoria);
    hero.insertAdjacentHTML('afterbegin',
      `<div class="mono"><b>${esc(iniciales(T.nombre))}</b><span>${esc(pretty(T.categoria))}</span></div>`);
  }

  document.getElementById('nombre').textContent = T.nombre || '';
  const s0 = (T.shows||[])[0] || {};
  document.getElementById('sub').textContent =
    [s0.subcategoria ? pretty(s0.subcategoria) : pretty(T.categoria), T.tipo ? pretty(T.tipo) : '']
      .filter(Boolean).join(' · ');

  const bd = [];
  if(T.verificado) bd.push('<span class="bdg ver">✓ Verificado</span>');
  if(T.partner)    bd.push('<span class="bdg par">★ Partner SHOWMA</span>');
  document.getElementById('badges').innerHTML = bd.join('');

  const h = [];
  const chips = [];
  if(T.ciudad)          chips.push(`<span class="chip">📍 <b>${esc(T.ciudad)}</b></span>`);
  if(T.viaja)           chips.push(`<span class="chip">✈️ Viaja a otras ciudades</span>`);
  if(T.experiencia)     chips.push(`<span class="chip">🎬 <b>${esc(T.experiencia)}</b> de experiencia</span>`);
  if((T.idiomas||[]).length) chips.push(`<span class="chip">🗣️ ${esc(T.idiomas.join(', '))}</span>`);
  if(chips.length) h.push(`<div class="chips">${chips.join('')}</div>`);

  h.push(datosHTML(T.trayectoria));

  if(T.bio) h.push(`<h2>Quiénes son</h2><div class="bio">${esc(T.bio)}</div>`);

  if((T.shows||[]).length){
    h.push(`<h2>${T.shows.length>1?'Sus espectáculos':'Su espectáculo'}</h2>`);
    T.shows.forEach(s=>{
      const foto = (s.fotos||[])[0];
      const th = foto
        ? `<div class="th" style="background-image:url('${esc(foto)}')"></div>`
        : `<div class="th" style="background:${grad(s.categoria)}"><div class="ini">${esc(iniciales(s.nombre))}</div></div>`;
      const meta = [pretty(s.subcategoria)||pretty(s.categoria),
        s.duracion_min ? s.duracion_min+' min' : '',
        s.integrantes ? s.integrantes+(s.integrantes>1?' integrantes':' integrante') : '']
        .filter(Boolean).join(' · ');
      h.push(`<div class="show">${th}<div>
        <h3>${esc(s.nombre)}</h3>
        ${meta?`<div class="meta">${esc(meta)}</div>`:''}
        ${s.descripcion?`<div class="desc">${esc(s.descripcion)}</div>`:''}
        ${(s.generos||[]).length?`<div class="gen">${s.generos.slice(0,5).map(g=>`<span>${esc(g)}</span>`).join('')}</div>`:''}
      </div></div>`);
    });
  }

  /* Un mismo enlace no se pinta dos veces. Es lo normal, no la excepcion:
     muchos proveedores pegan la misma liga de YouTube en el show y en sus
     redes, y la tarjeta salia con dos botones que llevan al mismo lado. */
  const vids = [];
  const vistos = new Set();
  (T.shows||[]).forEach(s=>{ if(s.video && !vistos.has(s.video)){ vistos.add(s.video);
    vids.push({url:s.video, tit:s.nombre, sub:'Ver el video del show'}); } });
  if(T.youtube && !vistos.has(T.youtube)){ vistos.add(T.youtube);
    vids.push({url:T.youtube, tit:'Canal de YouTube', sub:'Más material del proveedor'}); }
  if(vids.length){
    h.push('<h2>Video</h2>');
    vids.forEach(v=>h.push(`<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener">
      <div class="pl">▶</div><div><b>${esc(v.tit)}</b><span>${esc(v.sub)}</span></div></a>`));
  }

  // La portada ya se ve arriba a pantalla completa: repetirla en la galeria
  // hace que la tarjeta parezca que tiene una foto menos de las que tiene.
  const gal = (T.galeria||[]).filter(u=>u!==T.portada);
  if(gal.length){
    h.push('<h2>Galería</h2><div class="gal">');
    gal.forEach(u=>h.push(`<a href="${esc(u)}" target="_blank" rel="noopener" style="background-image:url('${esc(u)}')"></a>`));
    h.push('</div>');
  }

  h.push(resenasHTML(T.resenas));

  document.getElementById('body').innerHTML = h.join('');
}

/* ---- Compartir ----------------------------------------------------------
   En celular sale el menu del sistema (WhatsApp de primero, que es donde esto
   se va a usar). En escritorio no existe, asi que se copia la liga. */
function compartir(){
  const url = window.TARJETA_URL || location.href;
  const txt = `${T?T.nombre:'SHOWMA'} — perfil en SHOWMA`;
  if(navigator.share){ navigator.share({title:txt, text:txt, url}).catch(()=>{}); return; }
  copiar(url);
}
function copiar(url){
  const done = ()=>toast('Liga copiada');
  if(navigator.clipboard && location.protocol==='https:'){ navigator.clipboard.writeText(url).then(done,()=>fallback(url,done)); }
  else fallback(url,done);
}
function fallback(url,done){
  const i=document.createElement('textarea'); i.value=url; i.style.position='fixed'; i.style.opacity='0';
  document.body.appendChild(i); i.select();
  try{ document.execCommand('copy'); done(); }catch(e){ prompt('Copia la liga:', url); }
  i.remove();
}
let tt;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---- Solicitud ----------------------------------------------------------
   No se inventa un canal nuevo: esto cae en POST /leads/hotel, el mismo
   pre-registro publico que ya existe y que el administrador ya ve en su
   pantalla de Prospectos. Un endpoint publico nuevo seria una puerta mas que
   vigilar por la misma funcion. */
const ov = document.getElementById('ov');
ov.addEventListener('click', e=>{ if(e.target===ov) cerrar(); });
function cerrar(){ ov.style.display='none'; }
function abrir(){
  document.getElementById('mod').innerHTML = `
    <h3>Solicitar a ${esc(T?T.nombre:'')}</h3>
    <p class="h">Déjanos tus datos y SHOWMA te contacta con disponibilidad y condiciones.</p>
    <label for="f1">Tu nombre *</label><input id="f1" autocomplete="name">
    <label for="f2">Hotel o empresa *</label><input id="f2" autocomplete="organization">
    <label for="f3">Cargo</label><input id="f3" autocomplete="organization-title">
    <label for="f4">Correo *</label><input id="f4" type="email" inputmode="email" autocomplete="email">
    <label for="f5">Teléfono / WhatsApp</label><input id="f5" type="tel" inputmode="tel" autocomplete="tel">
    <label for="f6">¿Para cuándo y para qué espacio?</label><textarea id="f6" placeholder="Ej. viernes de diciembre en el lobby bar"></textarea>
    <div class="err" id="err"></div>
    <button class="btn" style="width:100%;margin-top:16px" id="env" onclick="enviar()">Enviar solicitud</button>
    <button class="btn gh" style="width:100%;margin-top:8px" onclick="cerrar()">Cancelar</button>`;
  ov.style.display='flex';
  setTimeout(()=>document.getElementById('f1').focus(),60);
}
function enviar(){
  const g = id => document.getElementById(id).value.trim();
  const err = document.getElementById('err');
  const nombre=g('f1'), empresa=g('f2'), correo=g('f4');
  // Se valida aqui lo mismo que valida el servidor. Un 422 crudo en una
  // pantalla publica no le dice nada a quien lo lee.
  if(nombre.length<2)  return fallo('Escribe tu nombre.');
  if(empresa.length<2) return fallo('Escribe el hotel o la empresa.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)) return fallo('Revisa el correo.');
  err.style.display='none';
  const b=document.getElementById('env'); b.disabled=true; b.textContent='Enviando…';
  // De donde vino la solicitud queda ESCRITO en el mensaje. Sin esto, en
  // Prospectos no hay forma de saber que la trajo la tarjeta de este
  // proveedor, que es justo lo que se quiere medir.
  const msg = `Solicitud desde la tarjeta pública de ${T?T.nombre:''}`
    + (g('f6') ? `\n\n${g('f6')}` : '');
  fetch(API+'/leads/hotel',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({full_name:nombre, company_name:empresa, position:g('f3')||null,
      email:correo, phone:g('f5')||null, message:msg})})
   .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
   .then(()=>{ document.getElementById('mod').innerHTML = `<div class="okbox">
        <div class="tick">✓</div><h3>Solicitud enviada</h3>
        <p class="h" style="margin:6px 0 0">Te contactamos por correo. Gracias.</p>
        <button class="btn" style="width:100%;margin-top:18px" onclick="cerrar()">Cerrar</button></div>`; })
   .catch(()=>{ b.disabled=false; b.textContent='Enviar solicitud';
        fallo('No se pudo enviar. Inténtalo de nuevo en un momento.'); });
}
function fallo(m){ const e=document.getElementById('err'); e.textContent=m; e.style.display='block'; }

pintar();
</script>
